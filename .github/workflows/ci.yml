name: CI

# `development` — рабочая ветка, в неё идут обычные коммиты. Проверки на ней
# гоняются так же, как на main, а вот деплой не трогается: он висит на
# `workflow_run` с фильтром `branches: [main]` и на прогоны по другим веткам
# не реагирует (см. .github/workflows/deploy.yml). В main вливаем по просьбе
# владельца — только этот мерж и приводит к выкату.
on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # Живой Postgres нужен интеграционным тестам сервиса заказов и приёма заказов с сайта.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: buscom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Имя базы обязано содержать «test»: src/test/db.ts откажется чистить любую другую.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/buscom_test
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      BETTER_AUTH_URL: http://localhost:3000
      SITE_WEBHOOK_SECRET: ci-webhook-secret-ci-webhook-secret-ci
      RUN_DB_TESTS: "1"

    steps:
      # v5 у всех трёх — первая мажорная версия на Node 24. На v4 раннер уже
      # принудительно запускал их вне заявленного Node 20 и предупреждал об этом.
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      # setup-node@v5 сам включает кэш, если в package.json есть packageManager.
      # Оставляем `cache: pnpm` явно: так видно, что кэшируется, и не зависит от
      # автоопределения. pnpm ставится раньше — иначе кэшу нечем считать путь к store.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # Команды ниже идут по всем пакетам монорепозитория (pnpm -r)
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @buscom/db exec prisma migrate deploy
      - run: pnpm test
      - run: pnpm --filter @buscom/db exec prisma validate
      - run: pnpm build

  # Образы собираются на каждом пуше: ошибка в Dockerfile всплывает здесь, а не
  # на боевом выкате; в образе заодно гоняется проверка распознавания накладной.
  # Из main образы ещё и публикуются в GHCR под тегом коммита — выкат (deploy.yml)
  # берёт готовые и не собирает их второй раз. Сборка идёт параллельно проверкам
  # `check`, которые дольше, так что в общее время CI она почти ничего не добавляет.
  # В development и pull request публикации нет.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_BASE: ghcr.io/${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - name: Собрать образы
        run: |
          set -euo pipefail
          docker build --target runner -t "$IMAGE_BASE/app:$SHA" .
          docker build --target migrator -t "$IMAGE_BASE/migrate:$SHA" .
          docker build --target site -t "$IMAGE_BASE/site:$SHA" .
      - name: Опубликовать образы (только main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for image in app migrate site; do
            docker push "$IMAGE_BASE/$image:$SHA"
          done
