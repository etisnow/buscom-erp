name: Deploy

# Деплой идёт только после зелёного CI по main: workflow_run дожидается
# окончания «CI» и проверяет его результат. Пуш сам по себе ничего не
# выкатывает — сломанная сборка до сервера не доедет.
#
# Коммиты в `development` и прогоны CI по ней сюда не доходят: фильтр
# `branches` у workflow_run смотрит на ветку того самого прогона CI. Выкат
# случается только когда ветку влили в main.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Ручной запуск — для отката и для первого выката
  workflow_dispatch:

# Два деплоя одновременно на один сервер не нужны; новый ждёт окончания текущего.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Пакеты GHCR: ghcr.io/<владелец>/<репозиторий>/app, /migrate и /site
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  # Образ собирается здесь, а не на сервере: на боевой машине 1.5 ГБ без swap
  # (OpenVZ, swap не добавить), и next build там убивает OOM-killer —
  # проверено на живом сервере, см. docs/DECISIONS.md.
  build:
    # Ручной запуск разрешён только с main или с тега (откат на прошлую версию).
    # Иначе достаточно было бы выбрать `development` в списке веток при запуске
    # вручную — и на боевой сервер уехало бы то, что в main ещё не влито.
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' &&
           (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))
          || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Определить коммит
        id: meta
        run: |
          # При workflow_run github.sha указывает на голову ветки по умолчанию,
          # а нужен именно тот коммит, который прошёл CI.
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Собираем $SHA"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.meta.outputs.sha }}

      - name: Войти в GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Собрать и опубликовать
        env:
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          # Оба образа из одного Dockerfile: runner — приложение, migrator —
          # Prisma CLI для миграций и сида.
          docker build --target runner \
            -t "$IMAGE_BASE/app:$SHA" -t "$IMAGE_BASE/app:latest" .
          docker build --target migrator \
            -t "$IMAGE_BASE/migrate:$SHA" -t "$IMAGE_BASE/migrate:latest" .
          # Сайт bus-com.ru — свой образ (apps/site)
          docker build --target site \
            -t "$IMAGE_BASE/site:$SHA" -t "$IMAGE_BASE/site:latest" .
          for image in app migrate site; do
            docker push "$IMAGE_BASE/$image:$SHA"
            docker push "$IMAGE_BASE/$image:latest"
          done

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: production

    steps:
      # Пока секреты не заведены, деплой пропускается, а не падает красным на
      # каждом пуше в main. Секреты в условии job'а использовать нельзя —
      # отсюда отдельный шаг с output.
      - name: Проверить, настроен ли деплой
        id: guard
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::Секреты деплоя не заданы (DEPLOY_HOST пуст) — выкат пропущен. Как их завести — docs/DEPLOY.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Подготовить SSH
        if: steps.guard.outputs.configured == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Ключ хоста берём из секрета, а не через ssh-keyscan на месте:
          # keyscan доверяет тому, кто ответил, и не защищает от подмены.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Дать серверу доступ к GHCR
        if: steps.guard.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          # Токен живёт только во время этого прогона и уходит через stdin —
          # в списке процессов на сервере он не появляется, на диске не оседает.
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/id_deploy -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Выкатить
        if: steps.guard.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          # Порт SSH задаётся переменной: у хостингов без выделенного IP он
          # нестандартный (на Джино.VPS — из раздела «Перенаправление портов»).
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/buscom-erp' }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' SHA='$SHA' IMAGE_BASE='$IMAGE_BASE' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_PATH"

          # Разворачиваем ровно то, что лежит в main, без локальных правок на сервере.
          # Нужен только compose-файл и рунбук — образы приходят из реестра.
          git fetch --prune origin main
          git reset --hard "$SHA"
          echo "Выкатываем $(git rev-parse --short HEAD): $(git log -1 --pretty=%s)"

          export APP_IMAGE="$IMAGE_BASE/app:$SHA"
          export MIGRATE_IMAGE="$IMAGE_BASE/migrate:$SHA"
          export SITE_IMAGE="$IMAGE_BASE/site:$SHA"
          COMPOSE="docker compose -f docker-compose.prod.yml --env-file .env.production"

          # Место чистим ДО скачивания, а не после удачного выката: диска 9.8 ГБ,
          # каждый выкат приносит два новых образа, и однажды pull упал на
          # «no space left on device» — с образами позапрошлых выкатов на диске.
          # Образы работающих контейнеров prune не трогает, остальное лежит в
          # GHCR и при откате скачается заново.
          echo "Место до очистки:"
          df -h / < /dev/null || true
          # Остановленный контейнер прошлой миграции держит свой образ (~2,5 ГБ:
          # migrator — это вся стадия сборки), и prune его не трогает. 25.09.2026
          # из-за этого pull упал на «no space left on device». Контейнер
          # одноразовый — up ниже создаст новый.
          $COMPOSE rm -f migrate < /dev/null || true
          docker image prune -af < /dev/null || true
          docker builder prune -af < /dev/null || true
          echo "Место после очистки:"
          df -h / < /dev/null || true
          docker system df < /dev/null || true

          $COMPOSE pull postgres app migrate site

          # Миграции накатывает одноразовый контейнер; приложение стартует только
          # после его успеха — это задано зависимостями в compose.
          $COMPOSE up -d --no-build

          # Проверяем опубликованный порт снаружи контейнера — ровно тот, куда
          # ходит проксирование хостинга. `docker compose exec` здесь нельзя:
          # он читает stdin, а этим stdin подаётся сам скрипт, и exec съедал
          # его остаток. Скрипт молча обрывался, шаг засчитывался успешным —
          # деплой рапортовал победу при упавшем приложении.
          PORT_SPEC=$(sed -n 's/^APP_PORT=//p' .env.production | head -1)
          CHECK_PORT=${PORT_SPEC##*:}
          CHECK_PORT=${CHECK_PORT:-81}

          # `up -d` возвращается сразу, приложению нужно время на старт.
          for i in $(seq 1 30); do
            if curl -sf --max-time 5 -o /dev/null "http://127.0.0.1:$CHECK_PORT/login" < /dev/null; then
              echo "Приложение отвечает на порту $CHECK_PORT"
              # Сайт: главная статическая и в базу не ходит — поднимается быстро.
              # Не ответил — выкат красный (ERP при этом уже на новой версии).
              SITE_SPEC=$(sed -n 's/^SITE_PORT=//p' .env.production | head -1)
              SITE_CHECK=${SITE_SPEC##*:}
              SITE_CHECK=${SITE_CHECK:-82}
              for j in $(seq 1 12); do
                if curl -sf --max-time 5 -o /dev/null "http://127.0.0.1:$SITE_CHECK/" < /dev/null; then
                  echo "Сайт отвечает на порту $SITE_CHECK"
                  break
                fi
                if [ "$j" = 12 ]; then
                  echo "Сайт не ответил за 60 секунд — логи ниже" >&2
                  $COMPOSE logs --tail 40 site < /dev/null >&2
                  exit 1
                fi
                sleep 5
              done
              # Прошлая версия остаётся в GHCR, а не на диске: 168-часовой фильтр,
              # который стоял здесь раньше, не удалял ничего — выкаты одного дня
              # все моложе недели, и диск кончился именно на них. Контейнер
              # миграции отработал — убираем, чтобы prune забрал и его образ.
              $COMPOSE rm -f migrate < /dev/null || true
              docker image prune -af < /dev/null || true
              exit 0
            fi
            sleep 5
          done

          echo "Приложение не ответило за 150 секунд — логи ниже" >&2
          $COMPOSE logs --tail 80 app < /dev/null >&2
          exit 1
          REMOTE

      - name: Закрыть доступ к GHCR
        if: always() && steps.guard.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" "docker logout ghcr.io" || true

      - name: Сообщить о провале
        if: failure()
        run: |
          echo "::error::Деплой не прошёл. Прошлая версия на сервере осталась работать:" \
               "docker compose up -d подменяет контейнеры только после успешного pull."
