# Боевой контур на одном сервере: Postgres, миграции, приложение, HTTPS.
# Разворачивание и эксплуатация — docs/DEPLOY.md.
#
# Запуск:  docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Локальная БД для разработки живёт в отдельном docker-compose.yml — этот файл
# её не заменяет и не пересекается с ней по именам томов.

name: buscom-erp

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?переменная обязательна}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?переменная обязательна}
      POSTGRES_DB: ${POSTGRES_DB:?переменная обязательна}
      # Сообщения Postgres в логах — на английском, иначе их не найти поиском
      LANG: C
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Каталог для выгрузок pg_dump, смонтирован с хоста (см. DEPLOY.md)
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Наружу порт не публикуем: в базу ходит только приложение из этой же сети.
    expose:
      - "5432"

  # Одноразовый контейнер: накатывает миграции и завершается. Приложение
  # стартует только после его успеха — иначе поднялось бы на старой схеме.
  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?переменная обязательна}
      # Нужны не миграциям, а сиду: этот же контейнер запускают командой
      # `run --rm migrate pnpm db:seed` при заведении первого администратора.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Администратор}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?переменная обязательна}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?переменная обязательна}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?переменная обязательна}
      SITE_WEBHOOK_SECRET: ${SITE_WEBHOOK_SECRET:?переменная обязательна}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-BusCom ERP <noreply@bus-com.ru>}
      TZ: Europe/Moscow
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"

  # HTTPS и сертификаты Let's Encrypt автоматом. PRD требует «только HTTPS».
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ERP_DOMAIN: ${ERP_DOMAIN:?переменная обязательна}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
